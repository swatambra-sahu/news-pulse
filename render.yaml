# Render Blueprint for the News Pulse backend.
# Deploy: connect this repo on Render and it will pick up this file
# (https://render.com/docs/infrastructure-as-code), building the Docker
# image at backend/Dockerfile (context = repo root, so it can COPY both
# backend/ and scraper/).
#
# NOTE: Render's free-tier disks are ephemeral across deploys, so the
# SQLite file (and thus scraped data) will reset on redeploy. Attach a
# persistent disk (Render "Disks" add-on) mounted at /app/data, or swap to
# a hosted Postgres, for durability. See README's Deployment section.
services:
  - type: web
    name: news-pulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        sync: false # set to your deployed frontend URL
      - key: DB_PATH
        value: /app/data/newspulse.sqlite3
      - key: PYTHON_BIN
        value: /app/scraper/.venv/bin/python
      - key: SCRAPER_PATH
        value: /app/scraper/main.py
      - key: FEEDS
        sync: false # optional override, see scraper/config.py
    disk:
      name: news-pulse-data
      mountPath: /app/data
      sizeGB: 1
